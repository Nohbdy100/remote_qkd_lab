<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reserve a Slot</title>
</head>
<body>
  <h1>Reserve a Slot</h1>

  {% if messages %}
    <ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Reserve</button>
  </form>

  <p><a href="{% url 'my_appointments' %}">Back to My Appointments</a></p>
</body>
</html>
