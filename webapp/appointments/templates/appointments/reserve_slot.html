<!doctype html>
<html>
<head>
  <title>Reserve a timeslot</title>
</head>
<body>
  <h1>Reserve a timeslot</h1>

  {% if messages %}
    <ul>
      {% for m in messages %}
        <li>{{ m }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <table>
      {{ form.as_table }}
    </table>
    <button type="submit">Reserve</button>
    <a href="{% url 'appointments' %}">Back</a>
  </form>
</body>
</html>
